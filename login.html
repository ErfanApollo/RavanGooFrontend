<!doctype html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <title>ورود</title>
    <link rel="stylesheet" href="lib/font awesome/css/font-awsome-4.7.0.min.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/grid.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>
<body>
    <header class="header">
        <div class="social">
            <div class="container">
                <div class="social__links">
                    <a href="" class="social__link">
                        <i class="fab fa-github social__icon"></i>
                    </a>
                    <a href="" class="social__link">
                        <i class="fab fa-instagram social__icon"></i>
                    </a>
                    <a href="" class="social__link social__link--facebook">
                        <i class="fab fa-facebook-f social__icon"></i>
                    </a>
                    <a href="" class="social__link">
                        <i class="fab fa-twitter social__icon"></i>
                    </a>
                </div>

            </div>


        </div>
        <div class="container">
            <div class="header__items">
                <nav class="navbar">
                    <ul class="navbar__items">
                        <li class="navbar__item">
                            <a href="" class="navbar__link navbar__link--active">خانه</a>
                        </li>
                        <li class="navbar__item">
                            <a href="" class="navbar__link">ورود / ثبت نام</a>
                        </li>
                        <li class="navbar__item">
                            <a href="" class="navbar__link">آموزش</a>
                        </li>
                        <li class="navbar__item">
                            <a href="" class="navbar__link">تست ها</a>
                        </li>
                        <li class="navbar__item">
                            <a href="" class="navbar__link">طراحی تست</a>
                        </li>
                        <li class="navbar__item">
                            <a href="" class="navbar__link">درباره ی ما</a>
                        </li>
                    </ul>
                    <button type="button" class="navbar__hamburgerButton">
                        <i class="fa fa-bars"></i>
                    </button>
                    <div class="navbar__blackBackground"></div>
                    <ul class="navbar__itemsMobile">
                        <li class="navbar__itemMobile navbar__itemMobile--active">
                            <a href="" class="navbar__linkMobile navbar__linkMobile--active">خانه</a>
                        </li>
                        <li class="navbar__itemMobile">
                            <a href="" class="navbar__linkMobile">ورود / ثبت نام</a>
                        </li>
                        <li class="navbar__itemMobile">
                            <a href="" class="navbar__linkMobile">آموزش</a>
                        </li>
                        <li class="navbar__itemMobile">
                            <a href="" class="navbar__linkMobile">تست ها</a>
                        </li>
                        <li class="navbar__itemMobile">
                            <a href="" class="navbar__linkMobile">طراحی تست</a>
                        </li>
                        <li class="navbar__itemMobile">
                            <a href="" class="navbar__linkMobile">درباره ی ما</a>
                        </li>
                    </ul>
                </nav>

                <div class="header__logo">
                    <img src="img/logo.jpg" class="header__logo-image"/>
                </div>
            </div>
        </div>

    </header>
    <main class="main">
        <div class="container">
            <section class="login">
                <div class="login__header">
                    <h2 class="login__title">ورود یا ثبت ‌نام</h2>
                    <p class="login__description">اگر قبلا ثبت نام نکردید بر روی ثبت نام کلیک کنید در غیر این صورت وارد شوید</p>
                </div>
                <form action="" class="login__form">
                    <div class="login__field">
                        <label for="username" class="login__label">نام کاربری / ایمیل</label>
                        <input type="text" name="username" id="username" class="login__input" placeholder="نام کاربری یا ایمیل خود را وارد کنید">
                    </div>
                    <div class="login__field">
                        <label for="password" class="login__label">رمز عبور</label>
                        <input type="password" name="password" id="password" class="login__input" placeholder="رمزعبور خود را وارد کنید">
                    </div>
                    <button type="button" class="login__button">ثبت نام</button>
                    <button class="login__button">ورود</button>
                </form>
            </section>
        </div>
    </main>



    <script src="lib/font awesome/js/all.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
