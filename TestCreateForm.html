<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <title>طراحی تست</title>
    <link rel="stylesheet" href="lib/font awesome/css/font-awsome-4.7.0.min.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/grid.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/TestCreateForm/app.css">
    <link rel="stylesheet" href="css/TestCreateForm/responsive.css">
</head>
<body>

<header class="header">
    <div class="social">
        <div class="container">
            <div class="social__links">
                <a href="" class="social__link">
                    <i class="fab fa-github social__icon"></i>
                </a>
                <a href="" class="social__link">
                    <i class="fab fa-instagram social__icon"></i>
                </a>
                <a href="" class="social__link social__link--facebook">
                    <i class="fab fa-facebook-f social__icon"></i>
                </a>
                <a href="" class="social__link">
                    <i class="fab fa-twitter social__icon"></i>
                </a>
            </div>

        </div>


    </div>
    <div class="container">
        <div class="header__items">
            <nav class="navbar">
                <ul class="navbar__items">
                    <li class="navbar__item">
                        <a href="" class="navbar__link navbar__link--active">خانه</a>
                    </li>
                    <li class="navbar__item">
                        <a href="" class="navbar__link">ورود / ثبت نام</a>
                    </li>
                    <li class="navbar__item">
                        <a href="" class="navbar__link">آموزش</a>
                    </li>
                    <li class="navbar__item">
                        <a href="" class="navbar__link">تست ها</a>
                    </li>
                    <li class="navbar__item">
                        <a href="" class="navbar__link">طراحی تست</a>
                    </li>
                    <li class="navbar__item">
                        <a href="" class="navbar__link navbar__link--alert">خروج از حساب کاربری</a>
                        <div class="navbar__itemAlert navbar__itemAlert--open">
                            <p class="navbar__itemAlertText">آیا میخواهید از سایت خارج شوید</p>
                            <button type="button" class="navbar__itemAlertClose">خیر</button>
                            <button type="button" class="navbar__itemAlertExit">بله</button>
                        </div>
                    </li>
                </ul>
                <button type="button" class="navbar__hamburgerButton">
                    <i class="fa fa-bars"></i>
                </button>
                <div class="navbar__blackBackground"></div>
                <ul class="navbar__itemsMobile">
                    <li class="navbar__itemMobile navbar__itemMobile--active">
                        <a href="" class="navbar__linkMobile navbar__linkMobile--active">خانه</a>
                    </li>
                    <li class="navbar__itemMobile">
                        <a href="" class="navbar__linkMobile">ورود / ثبت نام</a>
                    </li>
                    <li class="navbar__itemMobile">
                        <a href="" class="navbar__linkMobile">آموزش</a>
                    </li>
                    <li class="navbar__itemMobile">
                        <a href="" class="navbar__linkMobile">تست ها</a>
                    </li>
                    <li class="navbar__itemMobile">
                        <a href="" class="navbar__linkMobile">طراحی تست</a>
                    </li>
                    <li class="navbar__itemMobile">
                        <a href="" class="navbar__linkMobile">درباره ی ما</a>
                    </li>
                </ul>
            </nav>

            <div class="header__logo">
                <img src="img/logo.jpg" class="header__logo-image"/>
            </div>
        </div>
    </div>
<!--    <div class="container">-->
</header>
<div class="container">
    <section class="TestCreate">
        <h2 class="TestCreate__title">طراحی تست</h2>
        <form action="" class="TestCreateForm">
            <input type="text" name="" id="" class="TestCreateForm__testName" placeholder="عنوان تست را وارد کنید ">
            <textarea name="" id="" cols="30" rows="10" class="TestCreateForm__testDescription" placeholder="چکیده کوتاهی از تست را بنویسید"></textarea>
            <section class="question">
                <h6 class="question__number">سوال شماره 1</h6>
                <input type="text" name="" id="" class="question__input" placeholder="متن سوال را وارد نماييد ">
                <div class="answer">
                    <input type="text" name="" id="" class="answer__input" placeholder="پاسخ شماره 1 را وارد كنيد">
                    <input type="text" name="" id="" class="answer__input" placeholder="پاسخ شماره 2 را وارد كنيد">
                    <input type="text" name="" id="" class="answer__input" placeholder="پاسخ شماره 3 را وارد كنيد">
                    <input type="text" name="" id="" class="answer__input" placeholder="پاسخ شماره 4 را وارد كنيد">
                </div>
            </section>

            <button type="button" class="TestCreate__submit">ثبت نهایی تست</button>
        </form>
    </section>
</div>

<script src="lib/font awesome/js/all.js"></script>
<script src="js/script.js"></script>
</body>
</html>
